<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="robots" content="noindex, nofollow" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>H3-4 HV seeds (Preview only)</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; padding: 16px; background: #fff8ea; color: #3d2a16; font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p { margin: 4px 0 10px; }
  .warn { background: #ffe7b0; border-radius: 10px; padding: 8px 10px; font-size: 13px; }
  .err { background: #f8d0c8; }
  ul { list-style: none; padding: 0; margin: 12px 0; display: grid; gap: 8px; }
  button { width: 100%; min-height: 48px; border: 0; border-radius: 12px; background: linear-gradient(180deg, #ffc15e, #f39a1e); color: #3d2a16; font: 700 15px/1.2 inherit; text-align: left; padding: 8px 12px; }
  button small { display: block; font-weight: 400; font-size: 12px; opacity: 0.85; margin-top: 2px; }
  .ghost { background: #f3e6c8; }
  textarea { width: 100%; box-sizing: border-box; height: 90px; font: 11px/1.3 ui-monospace, monospace; }
  a { color: #b3570f; }
</style>
</head>
<body>
<h1>H3-4 Human Verification seeds</h1>
<p>PR #251 の Preview 専用ページです。<b>Preview のセーブ（teto-pizza-preview-save-v1）だけ</b>を書き換えます。本番のセーブ（teto-pizza-save-v1）には一切触れません。</p>
<p class="warn" id="status">準備中…</p>

<p><b>1.</b> 必要なら今の Preview セーブを控える（任意）</p>
<button class="ghost" id="backup">今の Preview セーブを下に表示</button>
<textarea id="dump" readonly placeholder="(Preview セーブ)"></textarea>
<button class="ghost" id="restore">上の内容で Preview セーブを戻す</button>

<p><b>2.</b> シナリオを選ぶ → 自動でゲームが開きます → フリークッキング → 生地 → 「次へ」でトッピングまで → 「ヒント」</p>
<ul id="seeds"></ul>
<p><a href="./">ゲームを開く（seed しない）</a></p>

<script>
(() => {
  // Preview-only: this file is committed to perusonao/teto-pizza-game-preview's site/ by hand after
  // a deploy and is never part of perusonao/teto-pizza-game (no production bundle carries it).
  const KEY = "teto-pizza-preview-save-v1";
  const status = document.getElementById("status");
  const onPreviewPath = location.pathname.startsWith("/teto-pizza-game-preview/") || location.hostname === "localhost";
  if (!onPreviewPath) {
    status.textContent = "Preview（/teto-pizza-game-preview/）以外では動きません。";
    status.classList.add("err");
    return;
  }
  const LADDER = [
    ["margherita", []], ["bismarck", ["egg"]], ["breakfast-pizza", ["bacon"]], ["funghi", ["mushroom"]],
    ["melanzane-pizza", ["eggplant"]], ["parmigiana-pizza", ["parmigiano"]], ["pepperoni", ["pepperoni"]],
    ["salsiccia", ["sausage"]], ["meat-lovers", ["ham"]], ["bambino", ["corn"]], ["hawaiian", ["pineapple"]],
    ["capricciosa", ["black-olive", "oregano"]], ["pizza-portuguesa", ["onion"]], ["fugazza", ["olive-oil"]],
    ["marinara", ["garlic"]], ["napoletana", ["anchovy"]], ["tonno-e-cipolla", ["tuna"]], ["pesto-tonno", ["pesto"]],
    ["genovese", ["cherry-tomato"]], ["new-haven-apizza", ["clam"]], ["pesto-caprese", ["fresh-tomato"]],
    ["pesto-patate", ["potato"]], ["pizza-bianca", ["rosemary"]], ["puttanesca-pizza", ["capers"]],
    ["quattro-formaggi", ["fontina", "gorgonzola"]],
  ];
  const save = (count, pitz, purchases, facts) => {
    const materials = LADDER.slice(1, count + 1).flatMap(([, m]) => m);
    return {
      schemaVersion: 2,
      dex: LADDER.slice(0, count).map(([recipeId]) => ({ recipeId, discovered: true, bestScore: 70, bestStars: 3, timesMade: 1 })),
      pitzBalance: pitz,
      ...(purchases ? { discoveryHintPurchases: purchases } : {}),
      ...(facts ? { discoveryHintFacts: facts } : {}),
      ownedIngredientIds: ["tomato-sauce", "mozzarella", "basil", ...materials],
      missionBest: {},
      inventory: Object.fromEntries(materials.map((m) => [m, 10])),
      starterGrantClaimedRecipeIds: [],
      unlockedForShopIngredientIds: materials,
    };
  };
  const SEEDS = [
    ["HV1_DEX0_MARGHERITA", "HV-1 新規 Dex0 マルゲリータ", "無料オンボーディング（変更なし）", save(0, 0)],
    ["HV2_FRESH", "HV-2〜5・9・12・13・16 未購入（Dex11, 120 Pitz）", "通常購入 → 連続 → fallback → 支払いずみ → ガイダンス", save(11, 120)],
    ["HV6_SHORT_PITZ", "HV-6 Pitz不足（旧H3, 25 Pitz）", "40 Pitz がグレーで押せない", save(11, 25, { capricciosa: 3 })],
    ["HV7_LEGACY_H1", "HV-7 旧H1 セーブ（200 Pitz）", "10 → 20 → 40 → 支払いずみで本物のヒント", save(11, 200, { capricciosa: 1 })],
    ["HV7_LEGACY_H2", "HV-7 旧H2 セーブ", "20 から継続", save(11, 200, { capricciosa: 2 })],
    ["HV7_LEGACY_H3", "HV-7 旧H3 セーブ", "40 から継続・以前のヒント", save(11, 200, { capricciosa: 3 })],
    ["HV7_LEGACY_H4", "HV-7 旧H4 セーブ", "支払いずみ → ガイダンス・以前のヒント", save(11, 200, { capricciosa: 4 })],
    ["HV8_LEGACY_H2_PLUS_NEW", "HV-8 旧H2 ＋ 新ヒント混在", "40 → 支払いずみで本物のヒント → ガイダンス", save(11, 200, { capricciosa: 2 }, { capricciosa: ["ing:ham"] })],
    ["HV9_ALL_BOUGHT_FRESH", "HV-9 新規セーブで全部購入済み", "支払いずみ → ガイダンス", save(11, 120, undefined, { capricciosa: ["ing:tomato-sauce", "ing:mozzarella", "ing:mushroom", "ing:ham"] })],
    ["HV10_ONE_FACT_RECIPE", "HV-10 売れるヒントが1つのピザ（Dex1）", "5 → 10 Pitz表示でガイダンス・消費0", save(1, 50)],
    ["HV10_PIZZA_BIANCA", "HV-10 売れるヒント0のピザ（Dex22）", "5 Pitz表示でガイダンス・消費0", save(22, 50)],
  ];
  const list = document.getElementById("seeds");
  for (const [id, title, note, data] of SEEDS) {
    const li = document.createElement("li");
    const b = document.createElement("button");
    b.innerHTML = `${title}<small>${note}</small>`;
    b.addEventListener("click", () => {
      localStorage.setItem(KEY, JSON.stringify(data));
      location.href = "./";
    });
    b.dataset.seed = id;
    li.appendChild(b);
    list.appendChild(li);
  }
  const dump = document.getElementById("dump");
  document.getElementById("backup").addEventListener("click", () => { dump.value = localStorage.getItem(KEY) ?? "(Preview セーブなし)"; });
  document.getElementById("restore").addEventListener("click", () => {
    const v = dump.value.trim();
    if (!v || v.startsWith("(")) return;
    JSON.parse(v);
    localStorage.setItem(KEY, v);
    status.textContent = "Preview セーブを戻しました。";
  });
  // Also supports ?seed=<ID> for a one-tap link.
  const q = new URLSearchParams(location.search).get("seed");
  const hit = SEEDS.find(([id]) => id === q);
  if (hit) { localStorage.setItem(KEY, JSON.stringify(hit[3])); location.replace("./"); return; }
  status.textContent = "OK: Preview ページです。ボタンを押すと Preview セーブだけを置き換えてゲームを開きます。";
})();
</script>
</body>
</html>
